services:
  order-db:
    image: postgres:15
    container_name: order-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=order
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./sql/init_order.sql:/docker-entrypoint-initdb.d/init_orders.sql:ro
  inventory-db:
    image: postgres:15
    container_name: inventory-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=inventory
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - inventory-data:/var/lib/postgresql/data
      - ./sql/init_inventory.sql:/docker-entrypoint-initdb.d/init_inventory.sql:ro
  broker:
    image: apache/kafka:3.9.1
    container_name: broker
    ports:
      - "9092:9092" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
  pgadmin:
    image: dpage/pgadmin4:9.4.0
    container_name: pgadmin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      - order-db
      - inventory-db
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8080:8080
  product:
    container_name: product
    build:
      context: .
      dockerfile: cmd/payflow/product/Dockerfile
    restart: always
    depends_on:
      - inventory-db
      - broker
    environment:
      KAFKA_BROKER: broker:9092
      KAFKA_GROUPID: payflow-group
      ORDER_REQUESTED_TOPIC: order.requested
      INVENTORY_CHECKED_TOPIC: inventory.checked
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_USERNAME: ${DB_USER}
      INVENTORY_DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_DB_PORT: "5432"
      PRODUCT_GRPC_PORT: :50052
      ENVIRONMENT: development
  order:
    container_name: order
    build:
      context: .
      dockerfile: cmd/payflow/order/Dockerfile
    restart: always
    depends_on:
      - order-db
      - broker
    environment:
      KAFKA_BROKER: broker:9092
      KAFKA_GROUPID: payflow-group
      ORDER_REQUESTED_TOPIC: order.requested
      INVENTORY_CHECKED_TOPIC: inventory.checked
      ORDER_DB_HOST: order-db
      ORDER_DB_USER: ${DB_USER}
      ORDER_DB_PASSWORD: ${DB_PASSWORD}
      ORDER_DB_PORT: "5432"
      ORDER_GRPC_PORT: :50051
      ENVIRONMENT: development
  apigateway:
    container_name: apigateway
    build:
      context: .
      dockerfile: cmd/payflow/apigateway/Dockerfile
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - order
      - product
    environment:
      APIGATEWAY_PORT: :8080
      ORDER_SERVICE: order:50051
      PRODUCT_SERVICE: product:50052
      JWT_SECRET_KEY: change-me
      ENVIRONMENT: development
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - apigateway
volumes:
  orders-data:
  inventory-data:
